wood:
  - ic_wood
  # Sun's Dusk firewood (woodcutting yield + vendor stock) — soft interop
  - sd_wood_1
  - sd_wood_publican
  - sd_wood_merchant
stone:
  - ic_stone
charcoal:
  # Tamriel Data mined charcoal/coal — also the charcoal pit's own product
  - T_IngMine_Charcoal_01
  - T_IngMine_Coal_01
# clay is tagged in ImmersiveCrafting_Ingredients.yaml (real OAAB/TR clay records)
# ── crafting tool/material tags on existing records (no ic_* record needed) ──
crucible:
  - T_Rga_Crucible_01
mortar:
  - apparatus_a_mortar_01
  - apparatus_j_mortar_01
  - apparatus_m_mortar_01
  - apparatus_g_mortar_01
  - apparatus_sm_mortar_01
fibre:
  - ingred_kresh_fiber_01
rope:
  - T_Com_Rope_01
raw_glass:
  - ingred_raw_glass_01
  - ingred_raw_glass_tinos
firestarter:
  - AB_Misc_FlintAndSteel
  - AB_Misc_Flint
# ── foraging tool tags ──
# tree/rock target tags are generated into ImmersiveCrafting_Statics.yaml by
# tools/static_tags.py (from the tes3-records dump) — don't hand-add them here.
axe:
  - chitin war axe
  - iron war axe
shovel:
  - misc_de_muck_shovel_01
planter:
  - ic_station_planter

